name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Codex/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Codex/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        env:
          # HTML ships on Pages; large intro MP4 is on GitHub Release (see Codex/docs/CUTSCENE_MEDIA.md).
          VITE_LH_MEDIA_BASE_URL: https://github.com/585swinemerchant/legendary-horizon-demo/releases/download/intro-media-v1/
        run: npm run build

      - name: Verify GitHub Pages media base
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('dist/index.html', 'utf8');
          const required = [
            'https://585swinemerchant.github.io/legendary-horizon-demo/${',
            '/legendary-horizon-demo/assets/intro/scene_4_dagger_sword_1775784333493.png',
          ];
          const missing = required.filter((needle) => !html.includes(needle));
          if (missing.length) {
            console.error('GitHub Pages media base check failed. Missing:', missing);
            process.exit(1);
          }
          console.log('GitHub Pages media base check passed.');
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Codex/frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
