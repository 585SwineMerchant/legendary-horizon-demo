<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legendary Horizon: The Hero's Journey</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        :root {
            --midnight: #0a0c10;
            --gold: #d97706;
            --amber: #f59e0b;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--midnight);
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .modal-active #ui-overlay {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
        }

        #app-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 1200px;
            height: 85%;
            background: var(--midnight);
            border: 4px solid var(--gold);
            box-shadow: 0 0 50px rgba(0,0,0,0.9), 0 0 20px rgba(217, 119, 6, 0.3);
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        #app-container.active {
            display: flex;
        }

        #app-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            width: 3.5rem;
            height: 3.5rem;
            background: var(--gold);
            color: black;
            border: 3px solid white;
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 100;
            transition: all 0.2s;
        }

        .close-btn:hover {
            background: var(--amber);
            transform: scale(1.1);
        }

        #realm-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 50;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
        }

        #realm-overlay.active {
            display: flex;
        }

        .realm-card {
            width: 80%;
            max-width: 900px;
            background: var(--midnight);
            border: 3px solid var(--gold);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(217, 119, 6, 0.4);
        }

        #realm-image-container {
            width: 100%;
            height: 400px;
            overflow: hidden;
            border-bottom: 2px solid var(--gold);
        }

        #realm-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #realm-info {
            padding: 2rem;
            color: white;
        }

        #realm-name {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            margin: 0;
            color: var(--amber);
        }

        #realm-cluster {
            font-family: 'Inter', sans-serif;
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .action-btn {
            background: var(--gold);
            color: black;
            border: none;
            padding: 1rem 2rem;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.8rem;
            cursor: pointer;
            margin-top: 1rem;
            transition: transform 0.2s;
        }

        .action-btn:hover {
            transform: scale(1.05);
            background: var(--amber);
        }

        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            cursor: pointer;
            text-align: center;
        }

        #start-screen h1 {
            color: var(--gold);
            font-family: 'Cinzel', serif;
            font-size: 3rem;
            margin-bottom: 1rem;
            text-shadow: 0 0 20px rgba(217, 119, 6, 0.5);
        }

        #start-screen p {
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            font-size: 1rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <div id="start-screen" onclick="startGame()">
        <h1>LEGENDARY HORIZON</h1>
        <p>CLICK TO BEGIN YOUR JOURNEY</p>
    </div>
    <div id="asset-store" style="display:none;">
        <img id="tiles-img" src="">
        <img id="hero-img" src="">
        <img id="buildings-img" src="">
        <img id="chars-img" src="">
        <img id="forest-img" src="">
        <img id="mountain-img" src="">
        <img id="water-img" src="">
        <img id="grass-img" src="">
        <img id="path-img" src="">
    </div>
    
    <div id="ui-overlay">
        <div id="app-container">
            <button class="close-btn" onclick="window.gameInstance.closeEvent()">X</button>
            <div id="app-content" style="width:100%; height:100%;">
                <!-- Dynamically injected content -->
            </div>
        </div>
    </div>

    <div id="realm-overlay" class="realm-ui">
        <div class="realm-card">
            <button class="close-btn" onclick="window.gameInstance.closeRealm()">X</button>
            <div id="realm-image-container">
                <img id="realm-image" src="" alt="Realm Image">
            </div>
            <div id="realm-info">
                <h2 id="realm-name">Realm Name</h2>
                <h3 id="realm-cluster">Career Cluster</h3>
                <p id="realm-desc">Explore this realm to learn about your future path.</p>
                <button class="action-btn" onclick="window.gameInstance.enterResearch()">Begin Research</button>
            </div>
        </div>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
