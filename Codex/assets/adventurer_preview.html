<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Legendary Horizon Traveler Preview</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1220;
      color: #e5e7eb;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        linear-gradient(90deg, rgba(148, 163, 184, 0.08) 1px, transparent 1px),
        linear-gradient(0deg, rgba(148, 163, 184, 0.08) 1px, transparent 1px),
        #0b1220;
      background-size: 32px 32px;
    }
    main {
      width: min(920px, calc(100vw - 32px));
      display: grid;
      gap: 20px;
    }
    h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0;
    }
    .stage {
      min-height: 360px;
      display: grid;
      place-items: center;
      background: #152513;
      border: 1px solid rgba(245, 158, 11, 0.42);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
      overflow: hidden;
    }
    .grass {
      width: 100%;
      min-height: 360px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 30% 40%, rgba(34, 197, 94, 0.18), transparent 26%),
        radial-gradient(circle at 70% 55%, rgba(132, 204, 22, 0.12), transparent 28%),
        #1f6f32;
      image-rendering: pixelated;
    }
    .sprite {
      width: 192px;
      height: 240px;
      background-image: url("../frontend/public/assets/player/adventurer/run_down.png");
      background-repeat: no-repeat;
      background-size: 2304px 240px;
      transform: translateY(18px);
      image-rendering: pixelated;
      animation: run 900ms steps(12) infinite;
      filter: drop-shadow(0 14px 0 rgba(0, 0, 0, 0.28));
    }
    @keyframes run {
      from { background-position-x: 0; }
      to { background-position-x: -2304px; }
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    button {
      border: 1px solid rgba(245, 158, 11, 0.45);
      background: rgba(15, 23, 42, 0.88);
      color: #f8fafc;
      padding: 10px 14px;
      cursor: pointer;
    }
    button:hover,
    button[aria-pressed="true"] {
      background: #f59e0b;
      color: #111827;
    }
  </style>
</head>
<body>
  <main>
    <h1>Traveler Preview</h1>
    <section class="stage" aria-label="Animated traveler sprite preview">
      <div class="grass">
        <div id="sprite" class="sprite" role="img" aria-label="Animated adventurer traveler"></div>
      </div>
    </section>
    <nav class="controls" aria-label="Preview controls">
      <button type="button" data-sheet="run_down" aria-pressed="true">Run Down</button>
      <button type="button" data-sheet="run_up">Run Up</button>
      <button type="button" data-sheet="run_left">Run Left</button>
      <button type="button" data-sheet="run_right">Run Right</button>
      <button type="button" data-sheet="idle_down">Idle Down</button>
      <button type="button" data-sheet="idle_up">Idle Up</button>
      <button type="button" data-sheet="idle_left">Idle Left</button>
      <button type="button" data-sheet="idle_right">Idle Right</button>
    </nav>
  </main>
  <script>
    const sprite = document.querySelector('#sprite');
    const buttons = [...document.querySelectorAll('button[data-sheet]')];
    for (const button of buttons) {
      button.addEventListener('click', () => {
        const sheet = button.dataset.sheet;
        sprite.style.backgroundImage = `url("../frontend/public/assets/player/adventurer/${sheet}.png")`;
        buttons.forEach((b) => b.setAttribute('aria-pressed', String(b === button)));
      });
    }
  </script>
</body>
</html>
